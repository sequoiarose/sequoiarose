          - "GPA: 4.0 (Distinguished Student Award)"
          - "Related Coursework: Probability Models, Advanced Probability Models, Categorical Data Analysis, Database Management Systems, Topics in Big Data, Statistical and Machine Learning, Computational Statistics"
          - "Thesis: A Statistical Analysis of Wildland and Prescribed Fires in the Changing California Climate"

      - institution: Santa Clara University
        location: Santa Clara, California, USA
        area: "Mathematics (applied emphasis), Psychology"
