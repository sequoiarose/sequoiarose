          - "Related Coursework: Probability and Statistics I (Probability Theory), Probability and Statistics II (Statistics), Advanced Calculus, Ordinary Differential Equations, Partial Differential Equations, Combinatorics, Numerical Analysis, Advanced Linear Algebra, Research Methods, Object Oriented Programming"

