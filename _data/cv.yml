cv:
  name: Sequoia Rose Andrade
  label: PhD Candidate
  email: srandrade@berkeley.edu
  address:
    city: Berkeley
    region: California, USA
  image: ""
  summary: Third year PhD Candidate in Statistics at UC Berkeley working on computational methods for social good applications.

  sections:
    # `Experience` is always rendered directly under the Summary card by the
    # al_folio_cv template, ahead of every other section below regardless of
    # this file's key order -- see al_folio_cv templates/cv/render.liquid.
    Experience:
      - company: University of California, Berkeley
        position: Graduate Student Research Fellow
        location: Berkeley, California, USA
        start_date: 2024
        summary: "Department of Statistics"
        highlights:
          - "Translated a Julia research code base into a reusable, modular Python package for carbon emission inversion modeling and increased computational efficiency by leveraging matrix sparsity"
          - "Implemented non-parametric statistics to analyze the effect of bomb threats on polling places in Georgia in the 2024 general election, which led to a conference presentation and publication"
          - "Authored two Expert Declarations filed as evidence in a complaint for a Racial Justice Act violation lawsuit, based on non-parametric simulation-based statistical inference and non-parametric combination of tests"

      - company: San Francisco State University
        position: Graduate Student
        location: San Francisco, California, USA
        start_date: 2022
        end_date: 2024
        summary: "Department of Mathematics &middot; Advisor: Dr. Alexandra Piryatinska"
        highlights:
          - "Created a novel dataset suitable for studying the effect of prescribed fires on wildfires while controlling for climate variables, by fusing disparate data sources from 2015-2022"
          - "Performed cross-correlation time series analysis to identify relevant variables"
          - "Utilized non-parametric statistical tests and regression models to evaluate the effect of prescribed burn treatment on wildfire size"

      - company: NASA Ames Research Center
        position: Research Engineer (Contract)
        location: Mountain View, California, USA
        start_date: 2020
        summary: "Open Data Integration for Wildfire Response (ODIN-Fire) &middot; Manager for Intelligent Knowledge Access (MIKA)"
        highlights:
          - "**ODIN-Fire:** Developed cloud and smoke classification model to improve satellite-based wildfire detection"
          - "**ODIN-Fire:** Trained and evaluated a fully connected neural network for image segmentation to classify smoke from cloud, using TensorFlow and self-supervised pre-training"
          - "**ODIN-Fire:** Deployed the model on a Python server and displayed results in a JavaScript application using an actor-based messaging system in Scala"
          - "**ODIN-Fire:** Resulted in multiple presentations and a journal manuscript in progress"
          - "**MIKA:** Developed and applied the Hazard Extraction and Analysis of Trends (HEAT) algorithm for use on large datasets containing both qualitative and quantitative data"
          - "**MIKA:** Implemented transformer-based natural language processing algorithms for information discovery, custom named-entity recognition, classification, and topic modeling"
          - "**MIKA:** Leveraged statistical analysis methods to interpret findings, identify significant predictors of hazard occurrence, and examine significant differences"
          - "**MIKA:** Resulted in four peer-reviewed journal publications"

      - company: NASA Ames Research Center
        position: Intern
        location: Mountain View, California, USA
        start_date: 2020
        end_date: 2020
        summary: "System Modeling and Analysis of Resilience in Scalable Traffic Management for Emergency Response Operations (SMARt-STEReO)"
        highlights:
          - "Collaborated with other interns to develop a simulation model of wildfire propagation and response using Python"
          - "Identified research questions on system performance and resilience, and tested them using statistics (t-test, ANOVA)"
          - "Resulted in four publications, including one peer-reviewed journal publication and two technical reports"

    Education:
      - institution: University of California, Berkeley
        location: Berkeley, California, USA
        area: Statistics
        studyType: PhD
        start_date: 2024
        end_date: present
        highlights:
